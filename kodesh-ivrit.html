<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kodesh et Ivrit · L'Académie des Petits Champions</title><style>*{box-sizing:border-box}body{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:#f5f5ff;color:#273052;margin:0}button{font:inherit;cursor:pointer;touch-action:manipulation}.wrap{max-width:900px;margin:auto;padding:20px 16px 60px}.top,.tabs,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.hero{background:linear-gradient(115deg,#5442bc,#a169df);padding:30px;color:white;border-radius:26px;margin:18px 0}.hero h1{font-size:clamp(30px,5vw,46px);margin:7px 0}.card{background:#fff;border:2px solid #eae6ff;border-radius:23px;padding:24px;margin:16px 0}.btn{border:0;border-radius:14px;padding:14px 18px;background:#6752d2;color:#fff;font-weight:900;min-height:50px}.btn.alt{color:#5541bb;background:#eeeaff}.btn:disabled{opacity:.45}.hide{display:none}.lesson{font-size:18px;line-height:1.7}.example{background:#eef6ff;border-left:5px solid #65a8e7;padding:15px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{border:3px solid #ebe7fc;color:#293254;background:#f9f7ff;border-radius:15px;font-size:clamp(19px,4vw,26px);font-weight:900;padding:13px;min-height:72px;overflow-wrap:anywhere}.choice.chosen{border-color:#735ce1;background:#eeeaff}.he{direction:rtl;font-size:1.3em}.bar{height:12px;background:#eeeaf9;border-radius:20px;overflow:hidden}.bar div{height:100%;background:#4ccba2}.score{font-size:74px;font-weight:1000;color:#6551ce;text-align:center}.review{border-bottom:1px solid #eee;padding:12px 0}.muted{color:#6e7891}.feedback{font-size:19px;font-weight:900;min-height:28px}.word{background:#f4f1ff;border-radius:15px;padding:14px;text-align:center}.word b{font-size:28px}.word small{display:block}.link{background:white;text-decoration:none;color:#5846c2;border-radius:14px;padding:12px;font-weight:900}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><a class="link" href="./">← Accueil</a><a class="link" href="parents.html">📊 Parents</a></div><div class="hero"><small>LEÇONS · JEUX · BILANS</small><h1 id="title">📜 Kodesh</h1><p id="subtitle"></p><div class="tabs"><button class="btn alt" onclick="choose('kodesh')">📜 Kodesh</button><button class="btn alt" onclick="choose('ivrit')">🔤 Ivrit</button></div></div><section id="intro"><div class="card lesson" id="lesson"></div><div class="card"><h2>🎯 Je m'entraîne</h2><p class="muted">10 questions pour réviser, ou un bilan de 20 questions noté sur 20.</p><div class="actions"><button class="btn" onclick="start(10)">🌱 Jeu · 10 questions</button><button class="btn" onclick="start(20)">🏆 Bilan sur 20</button></div><p id="last" class="muted"></p></div></section><section id="play" class="hide"><div class="card"><div class="top"><button class="btn alt" onclick="back()">← Leçon</button><strong id="count"></strong></div><div class="bar" style="margin:18px 0"><div id="progress"></div></div><h2 id="prompt"></h2><div class="grid" id="options"></div><p id="feedback" class="feedback"></p><button class="btn" id="next" disabled onclick="advance()">Valider →</button></div></section><section id="end" class="hide"><div class="card"><h1 style="text-align:center">🎉 Bravo !</h1><div class="score" id="score"></div><p id="message" style="text-align:center"></p><h2>Corrections</h2><div id="review"></div><div class="actions" style="margin-top:20px"><button class="btn" onclick="start(size)">Rejouer ↻</button><button class="btn alt" onclick="back()">Retour à la leçon</button></div></div></section></main><script>
const KB=[["Pourquoi Noa'h construit-il une arche ?","Pour échapper au déluge","Pour traverser la mer","Pour échapper au déluge","Pour monter au ciel"],["Que construit Noa'h ?","Une arche","Une tour","Une arche","Un palais"],["Qui entre dans l'arche avec Noa'h et sa famille ?","Les animaux","Les soldats","Les animaux","Les marchands"],["Combien de fils Noa'h a-t-il ?","Trois","Deux","Trois","Quatre"],["Comment s'appelle l'un des fils de Noa'h ?","Chem","Moché","Chem","Yossef"],["Combien de jours et de nuits a-t-il plu ?","40","7","40","100"],["Quel oiseau Noa'h envoie-t-il en premier ?","Le corbeau","La colombe","Le corbeau","L'aigle"],["Quel oiseau revient avec une feuille d'olivier ?","La colombe","Le corbeau","La colombe","L'aigle"],["Que rapporte la colombe ?","Une feuille d'olivier","Une pierre","Une feuille d'olivier","Un épi"],["Quel signe rappelle la promesse de Hachem ?","L'arc-en-ciel","Une étoile","L'arc-en-ciel","La lune"],["Sur quelles montagnes l'arche s'arrête-t-elle ?","Les montagnes d'Ararat","Le Sinaï","Les montagnes d'Ararat","Les Alpes"],["Quel événement recouvre la terre d'eau ?","Le déluge","Le déluge","Une sécheresse","Une pluie de sable"],["Qui construit la tour de Babel ?","Les hommes","Les hommes","Les anges","Les animaux"],["Comment s'appelle la grande tour du récit ?","La tour de Babel","Le palais de Pharaon","La tour de Babel","Le Temple"],["Que se passe-t-il avec les langues à Babel ?","Elles deviennent différentes","Tout le monde parle la même langue","Elles deviennent différentes","Les hommes ne parlent plus"],["Quel objet est lié à la paracha Noa'h ?","L'arche","Les dix plaies","L'arche","La matsa"],["Quel mot n'a pas de rapport avec Noa'h ?","Pharaon","Le déluge","Pharaon","La colombe"],["L'arc-en-ciel représente…","Un signe d'alliance","Un nouveau déluge","Un signe d'alliance","La fin du monde"],["Quel matériau sert à construire l'arche ?","Le bois","Le verre","La pierre","Le bois"],["De qui parle principalement cette paracha ?","Noa'h","Moché","Avraham","Noa'h"]],IV=[],E=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let subject='kodesh',size=10,questions=[],pos=0,selected=null,validated=false,results=[];
function profile(){return localStorage.getItem('meyronActiveProfile')||'meyron'}function key(){return 'academySacredV1:'+profile()}function history(){try{return JSON.parse(localStorage.getItem(key())||'[]')}catch(e){return []}}
function show(id){['intro','play','end'].forEach(x=>E(x).classList.toggle('hide',x!==id));scrollTo(0,0)}
function choose(s){subject=s;E('title').textContent=s==='kodesh'?'📜 Kodesh':'🔤 Ivrit';E('subtitle').textContent=s==='kodesh'?'Paracha Noa’h : l’arche, le déluge, les oiseaux, l’arc-en-ciel et la tour de Babel.':'Rubrique en attente des leçons d’Ivrit fournies par les parents.';E('lesson').innerHTML=s==='kodesh'?'<h2>📖 La paracha Noa’h</h2><p>Hachem demande à Noa’h de construire une <b>arche</b> pour sauver sa famille et des animaux du déluge. Il pleut pendant <b>40 jours et 40 nuits</b>. Noa’h a <b>trois fils</b> : Chem, Ham et Yafet.</p><p>Noa’h envoie d’abord <b>un corbeau</b>, puis <b>une colombe</b>. Celle-ci revient finalement avec une <b>feuille d’olivier</b>. L’<b>arc-en-ciel</b> est le signe de l’alliance.</p><div class="example">💡 Dans la suite de la paracha, les hommes construisent la <b>tour de Babel</b>. Leurs langues sont alors mélangées.</div>':'<h2>📖 Ivrit : en attente des leçons</h2><p>Les exercices seront ajoutés uniquement à partir des photos de cours que vous nous enverrez. Aucun programme inventé.</p>';E('practice').style.display=s==='ivrit'?'none':'';let h=history().filter(x=>x.subject===subject);E('last').textContent=h.length?'Dernière partie : '+h.at(-1).correct+'/'+h.at(-1).total+' bonnes réponses':'Aucune partie terminée pour le moment';show('intro')}
function back(){choose(subject)}function start(n){if(subject==='ivrit')return;size=n;questions=shuffle(subject==='kodesh'?KB:IV).slice(0,n);pos=0;results=[];render();show('play')}
function render(){let q=questions[pos];validated=false;selected=null;E('prompt').textContent=q[0];E('count').textContent='Question '+(pos+1)+' / '+size;E('progress').style.width=pos/size*100+'%';E('feedback').textContent='';E('next').disabled=true;E('next').textContent='Valider →';E('options').innerHTML='';shuffle(q.slice(2)).forEach(opt=>{let b=document.createElement('button');b.className='choice';b.textContent=opt;if(subject==='ivrit'&&/[א-ת]/.test(opt)){b.dir='rtl';b.lang='he';b.classList.add('he')}b.onclick=()=>{if(validated)return;selected=opt;E('options').querySelectorAll('button').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');E('next').disabled=false};E('options').append(b)})}
function advance(){if(!validated){if(selected===null)return;let q=questions[pos],correct=selected===q[1];results.push({question:q[0],answer:q[1],given:selected,correct});E('feedback').textContent=correct?'✨ Bonne réponse !':'💡 Bonne réponse : '+q[1];E('feedback').style.color=correct?'#15845a':'#ae4960';validated=true;E('next').textContent=pos===size-1?'Voir mon résultat 🏆':'Question suivante →';E('options').querySelectorAll('button').forEach(x=>x.disabled=true);return}if(pos<size-1){pos++;render()}else finish()}
function finish(){let correct=results.filter(x=>x.correct).length;let h=history();h.push({subject,correct,total:size,date:new Date().toISOString(),details:results});try{localStorage.setItem(key(),JSON.stringify(h.slice(-120)))}catch(e){}E('score').textContent=correct+'/'+size;E('message').textContent=correct===size?'🌟 Sans faute !':correct/size>=.7?'Bravo, tu progresses !':'Chaque essai te fait progresser !';E('review').innerHTML=results.map((x,i)=>'<div class="review"><b class="'+(x.correct?'correct':'incorrect')+'">'+(x.correct?'✓':'✗')+' '+(i+1)+'. '+esc(x.question)+'</b><div>Réponse : '+esc(x.answer)+'</div>'+(x.correct?'':'<div class="muted">Tu as répondu : '+esc(x.given)+'</div>')+'</div>').join('');show('end')}
choose(new URLSearchParams(location.search).get('matiere')==='ivrit'?'ivrit':'kodesh');
</script></body></html>
