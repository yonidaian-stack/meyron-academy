<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le coin des leçons • L'Académie des Petits Champions</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#263054;background:radial-gradient(circle at top left,#dff6ff,transparent 45%),#f7f6ff}button,a{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:20px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}a{color:#5b43bd;text-decoration:none;font-weight:900}.pill{background:white;padding:11px 15px;border:2px solid #e9e2ff;border-radius:14px}.hero{margin:23px 0;background:linear-gradient(115deg,#5643c6,#a35cdb);color:white;padding:35px;border-radius:27px}.hero h1{font-size:clamp(30px,5vw,49px);margin:7px 0}.hero p{font-size:18px;line-height:1.5}.subjects{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.subjects button{border:2px solid #e2dafa;background:white;border-radius:14px;padding:12px 17px;color:#5140a9;font-weight:900}.subjects button.active{background:#5c48ca;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:15px}.card{background:white;border:2px solid #eee9ff;border-radius:22px;padding:22px;box-shadow:0 8px 20px #4e40900a}.card h2{margin:10px 0;font-size:23px}.tag{background:#f0edff;color:#5c49c7;border-radius:30px;font-size:12px;font-weight:900;padding:7px 11px}.summary{color:#65718b;line-height:1.55;min-height:52px}.btn{display:inline-block;border:0;border-radius:14px;background:#5d49cb;color:white;padding:13px 18px;font-weight:900;text-decoration:none}.btn:hover{background:#4836a9}.lesson{background:white;border-radius:25px;padding:clamp(20px,4vw,36px);border:2px solid #e9e4ff;margin-top:18px}.lesson h2{font-size:clamp(27px,4vw,38px)}.lesson p,.lesson li{line-height:1.8;font-size:18px}.example{padding:16px 20px;background:#f0f8ff;border-left:5px solid #65b5f0;border-radius:12px;margin:14px 0}.tip{padding:16px 20px;background:#fff6dc;border-radius:12px;margin:14px 0}.quiz{background:#f6f2ff;border-radius:19px;padding:20px;margin-top:24px}.quiz button{border:2px solid #ded5fc;border-radius:12px;padding:12px 17px;background:white;margin:6px 8px 6px 0;font-weight:900;color:#5141b6}.feedback{font-weight:900;margin-top:12px;min-height:25px}.muted{color:#738099}#detail{scroll-margin-top:15px}@media(max-width:520px){.hero{padding:25px}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><a class="pill" href="index.html">← Accueil</a><strong>📖 Le coin des leçons</strong><a class="pill" href="arcade.html">🎮 Les jeux</a></header><section class="hero"><div style="font-size:12px;letter-spacing:.15em;font-weight:900">COMPRENDRE AVANT DE JOUER</div><h1>Les leçons expliquées simplement ✨</h1><p>Des explications faciles à lire, des exemples concrets et une petite question pour vérifier que tu as compris.</p></section><div class="subjects"><button class="active" onclick="filter('all',this)">Toutes les leçons</button><button onclick="filter('fr',this)">📚 Français</button><button onclick="filter('math',this)">🔢 Mathématiques</button></div><div class="grid" id="catalog"></div><div id="detail"></div></div><script>
const lessons=[
{id:'invariables',subject:'fr',emoji:'🧠',title:'Les mots invariables',summary:'40 mots à connaître : ils gardent toujours la même orthographe.',steps:['Un mot invariable est un mot qui <b>ne change jamais d’écriture</b>.','Il reste identique, même si on parle d’une ou de plusieurs personnes.','Pour les retenir, lis-les, écoute-les, puis écris-les sans regarder.'],example:'Exemple : « hier », « toujours » et « parce que » s’écrivent toujours de la même façon.',tip:'Les 5 listes de ton cahier contiennent 40 mots. Attention : « parce que » s’écrit en deux mots et « aujourd’hui » avec une apostrophe.',question:'Comment s’écrit le mot correctement ?',choices:['parceque','parce que','parsque'],answer:1,game:'dictee.html'},
{id:'infinitif',subject:'fr',emoji:'🐎',title:'L’infinitif du verbe',summary:'Reconnaître un verbe conjugué et retrouver son infinitif.',steps:['Un verbe <b>conjugué</b> change selon la personne ou le temps : « le cheval galope ».','Son <b>infinitif</b> est sa forme de base : « galoper ».','Pour le retrouver, tu peux dire <b>« il faut… »</b> : « il faut galoper ».','Les verbes en <b>-er</b> appartiennent généralement au 1er groupe, <b>sauf « aller »</b>. Les autres verbes peuvent appartenir au 2e ou au 3e groupe.'],example:'« Elle chante » → « il faut chanter » → infinitif : CHANTER.',tip:'Attention : tous les verbes en -ir ne sont pas du 2e groupe. « Finir » est du 2e groupe, mais « partir » est du 3e.',question:'Quel est l’infinitif de « il regarde » ?',choices:['regardait','regarder','regarde'],answer:1,game:'arcade.html?matiere=fr'},
{id:'lettrec',subject:'fr',emoji:'🍒',title:'La lettre C',summary:'Savoir quand la lettre C fait [s] ou [k].',steps:['Devant <b>e, i, y</b>, la lettre c fait souvent le son <b>[s]</b> : cerise, citron, cycle.','Devant <b>a, o, u</b>, elle fait généralement <b>[k]</b> : carotte, coq, cube.','La lettre <b>ç</b> fait le son <b>[s]</b> : garçon.','Dans certains mots, <b>sc</b> se prononce [s] : scie.'],example:'« cerise » → [s] ; « carotte » → [k] ; « garçon » → [s].',tip:'Regarde surtout la lettre qui vient après le C.',question:'Quel son fait le C dans « citron » ?',choices:['[k]','[s]'],answer:1,game:'arcade.html?matiere=fr'},
{id:'verbe',subject:'fr',emoji:'🕵️',title:'Reconnaître le verbe',summary:'Trouver l’action dans une phrase.',steps:['Le verbe indique souvent <b>ce que fait</b> quelqu’un ou quelque chose.','Pour le repérer, change le temps de la phrase : « Laura range » devient « Laura rangera ».','Le mot qui change est le verbe.'],example:'« Le chat saute » → « Hier, le chat sautait » : le verbe est « saute ».',tip:'Certains verbes expriment un état, comme « être » : ce ne sont pas toujours des actions.',question:'Dans « Léo dessine un soleil », quel est le verbe ?',choices:['Léo','dessine','soleil'],answer:1,game:'arcade.html?matiere=fr'},
{id:'dix',subject:'math',emoji:'🔟',title:'Les compléments à 10',summary:'Trouver le nombre qui manque pour faire 10.',steps:['Deux nombres sont <b>complémentaires à 10</b> quand leur somme vaut 10.','Tu peux compter sur tes doigts ou imaginer 10 jetons.','Apprends les paires : 0 + 10, 1 + 9, 2 + 8, 3 + 7, 4 + 6 et 5 + 5.'],example:'Si tu as 7 billes, il t’en manque 3 pour en avoir 10 : 7 + 3 = 10.',tip:'On peut inverser les nombres : 3 + 7 = 7 + 3 = 10.',question:'7 + ? = 10',choices:['2','3','4'],answer:1,game:'arcade.html?matiere=math'},
{id:'espace',subject:'math',emoji:'🧭',title:'Se repérer dans l’espace',summary:'Sur, sous, devant, derrière, à gauche, à droite…',steps:['<b>Sur</b> : au-dessus et posé dessus. <b>Sous</b> : en dessous.','<b>Devant</b> : du côté de l’avant. <b>Derrière</b> : à l’arrière.','<b>Entre</b> : au milieu de deux objets. <b>Dans</b> : à l’intérieur.','<b>À gauche</b> et <b>à droite</b> dépendent du point de vue.'],example:'Si la souris est dans la boîte, elle est à l’intérieur de la boîte.',tip:'Imagine-toi à la place du personnage pour choisir sa gauche et sa droite.',question:'Un jouet est placé entre deux chaises. Où est-il ?',choices:['Au milieu des chaises','Sous les chaises','Derrière les chaises'],answer:0,game:'arcade.html?matiere=math'},
{id:'longueurs',subject:'math',emoji:'📏',title:'Comparer et classer les longueurs',summary:'Mesurer des segments, comparer et ranger du plus long au plus court.',steps:['Pour savoir quel segment est le plus long, <b>on le mesure</b> avec une règle.','Place bien le <b>0</b> de la règle sur le début du segment.','Les centimètres et les millimètres servent à écrire la longueur : <b>1 cm = 10 mm</b>.','Pour comparer deux longueurs, mets-les dans <b>la même unité</b>. Par exemple, 3 cm = 30 mm, donc 3 cm est plus long que 25 mm.','Pour ranger du <b>plus long au plus court</b>, commence par le segment qui mesure le plus.','Deux segments peuvent avoir <b>la même longueur</b>, même si l’un est penché.','Pour <b>tracer un segment</b> : pose le 0 de la règle sur le point de départ, marque la bonne graduation, puis relie les deux points.'],example:'AB = 3 cm, CD = 2 cm et 7 mm, EF = 4 cm. Classement : EF > AB > CD.',tip:'Le bord de la règle n’est pas toujours le zéro ! Vérifie le chiffre 0 avant de mesurer. Pour tracer un segment, utilise une vraie règle et un crayon sur une feuille.',question:'Quel segment est le plus long : 3 cm ou 28 mm ?',choices:['28 mm','3 cm','Ils sont égaux'],answer:1,game:'arcade.html?matiere=math'},
{id:'quadrillage',subject:'math',emoji:'🗺️',title:'Se repérer sur un quadrillage',summary:'Identifier une ligne, une colonne, une case ou un nœud.',steps:['Une <b>colonne</b> est verticale et porte une <b>lettre</b> : A, B, C, D, E.','Une <b>ligne</b> est horizontale et porte un <b>nombre</b> : 1, 2, 3, 4.','Une <b>case</b> est un carré situé à la rencontre de la ligne et de la colonne.','Un <b>nœud</b> est le point où une ligne horizontale et une ligne verticale se croisent.','Les coordonnées sont données dans l’ordre : <b>(lettre ; nombre)</b>.'],example:'(B ; 3) : colonne B, ligne 3. Tu peux chercher une case ou un nœud selon la consigne.',tip:'Regarde bien si la consigne demande une case ou un nœud : ce n’est pas la même chose.',question:'Dans (D ; 2), quel est le numéro de la ligne ?',choices:['D','2','4'],answer:1,game:'quadrillage.html'},
{id:'regle',subject:'math',emoji:'📏',title:'Mesurer avec une règle',summary:'Comprendre les centimètres et les millimètres.',steps:['Pour mesurer, place le début de l’objet sur le <b>0</b> de la règle, pas sur son bord.','Les grands repères indiquent les <b>centimètres (cm)</b>.','Les petits traits indiquent les <b>millimètres (mm)</b>.','Dans 1 centimètre, il y a <b>10 millimètres</b>.'],example:'2 cm et 7 mm = 27 mm.',tip:'Vérifie que ta règle est bien droite et que l’objet commence au zéro.',question:'Combien y a-t-il de millimètres dans 3 cm ?',choices:['3','13','30'],answer:2,game:'arcade.html?matiere=math'},
{id:'lettres',subject:'fr',emoji:'🔤',title:'La lettre S',summary:'Comprendre les sons [s] et [z].',steps:['En début de mot, le S fait souvent le son <b>[s]</b> : soleil.','Entre deux voyelles, un seul S fait souvent le son <b>[z]</b> : maison.','Entre deux voyelles, <b>SS</b> fait le son [s] : poisson.'],example:'« maison » → [z] ; « poisson » → [s].',tip:'Écoute le son et observe les lettres autour du S.',question:'Dans « poisson », SS fait quel son ?',choices:['[z]','[s]'],answer:1,game:'classiques.html'}];
const E=id=>document.getElementById(id);let current='all';function filter(f,btn){current=f;document.querySelectorAll('.subjects button').forEach(x=>x.classList.toggle('active',x===btn));E('detail').innerHTML='';E('catalog').innerHTML=lessons.filter(l=>f==='all'||l.subject===f).map(l=>'<article class="card"><span class="tag">'+(l.subject==='fr'?'FRANÇAIS':'MATHÉMATIQUES')+'</span><div style="font-size:40px;margin-top:10px">'+l.emoji+'</div><h2>'+l.title+'</h2><p class="summary">'+l.summary+'</p><button class="btn" onclick="openLesson(\''+l.id+'\')">📖 Comprendre la leçon →</button></article>').join('')}
function openLesson(id){const l=lessons.find(x=>x.id===id);if(!l)return;E('detail').innerHTML='<section class="lesson"><a href="#catalog">↑ Toutes les leçons</a><h2>'+l.emoji+' '+l.title+'</h2><p class="muted">'+l.summary+'</p><h3>🌟 Je retiens</h3><ol>'+l.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol><div class="example"><strong>💡 Exemple</strong><div>'+l.example+'</div></div><div class="tip"><strong>🎯 L’astuce du champion</strong><div>'+l.tip+'</div></div><div class="quiz"><h3>🧩 Vérifie que tu as compris !</h3><p>'+l.question+'</p><div id="quizChoices">'+l.choices.map((c,i)=>'<button onclick="check('+i+',\''+id+'\')">'+c+'</button>').join('')+'</div><div class="feedback" id="quizFeedback" aria-live="polite"></div></div><p style="margin-top:22px"><a class="btn" href="'+l.game+'">🎮 M’entraîner avec les jeux →</a></p></section>';E('detail').scrollIntoView({behavior:'smooth',block:'start'})}
function check(i,id){const l=lessons.find(x=>x.id===id),ok=i===l.answer;E('quizFeedback').textContent=ok?'🎉 Bravo ! Tu as compris !':'💡 Pas tout à fait. Relis la leçon et réessaie.';E('quizFeedback').style.color=ok?'#168456':'#ae4c60'}filter('all',document.querySelector('.subjects button'));if(location.hash==='#infinitif'||location.hash==='#lettrec'||location.hash==='#quadrillage'){openLesson(location.hash.slice(1))}</script></body></html>
